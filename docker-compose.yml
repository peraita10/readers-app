services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment: { POSTGRES_DB: postgres, POSTGRES_USER: postgres }
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/postgres/migrations:/migrations:ro
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 15 }
volumes: { postgres_data: {} }
